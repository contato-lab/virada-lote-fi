<script id="md" type="text/plain"># BRIEFING FINAL, WEBMOTORS
### Suhai Festival Interlagos, edição AUTO. 27 a 30 de agosto de 2026, quinta a domingo. Autódromo de Interlagos, São Paulo.
**Para: designer. De: coordenação de mídia, Lime. Data: 20/08/2026, quinta. Faltam 7 dias.**

---

## LEIA ISTO ANTES DE ABRIR QUALQUER ARQUIVO

Duas coisas travam parte do material e precisam de resposta do cliente hoje, 20/08:

1. **Frota do Drive Pass.** O que está vendido é "pilota 3 carros na pista principal". Não sabemos quais carros. Enquanto não vier a lista por escrito, **nenhuma peça pode dizer "teste o seu próximo carro" nem citar modelo**. Todas as chamadas abaixo já estão na versão que não depende dessa lista.
2. **Contagem de marcas.** A lista confirmada tem 27 entradas contando "Omoda Jaecoo" como uma. Se o cliente contar como duas, vira 28 e o número muda em todas as peças. Todas as chamadas abaixo usam 27.

E uma coisa de prazo: **o e-mail patrocinado e o CRM push são os primeiros da fila**, porque quem diagrama é a Webmotors, com SLA de 3 dias úteis, e o relógio deles só começa quando o material chega completo. Os banners a gente controla. Esses dois, não.

---

## 1. O CONTEXTO EM 5 LINHAS

- Essas peças rodam **dentro do site da Webmotors**, o maior classificado de carros do Brasil. Não é rede social, é site de busca de carro.
- Quem vê está **em modo tarefa**: filtro ligado, comparando duas ou três versões do mesmo carro, checando se o preço do anúncio está acima ou abaixo da tabela. Decisão de R$ 80 mil a R$ 200 mil em aberto.
- Perfil que a própria Webmotors divulga: maioria homem, concentração em 25 a 34 anos.
- **Diferença dura em relação ao Meta:** no Meta o anúncio interrompe quem não estava pensando em carro, então precisa de sonho. Na Webmotors o anúncio disputa espaço com uma tarefa que a pessoa escolheu fazer. Anúncio que atrapalha a tarefa some. Anúncio que ajuda a tarefa entra.
- Consequência prática: **não dá pra cortar criativo do Meta**. Story 9:16 espremido em 728x90 não vira nada. Cada tamanho é reconstruído do zero.

**O erro mais caro possível é a peça parecer cartaz de festival.** Dentro de um classificado de carro, o cérebro classifica a peça em menos de um segundo. Se cair na gaveta "evento", ela é filtrada visualmente e nem é lida.

Exemplo concreto do que **não** fazer num 300x250: foto de palco iluminado ou multidão, título "4 DIAS DE MÚSICA E ADRENALINA", CTA "GARANTA JÁ SEU INGRESSO". Resultado: zero menção a carro numa peça que está dentro de um site onde a única coisa que importa é carro.

O mesmo espaço feito certo: foto de carro na pista com zebra reconhecível, título de 5 palavras sobre carro, apoio com data, CTA com verbo específico.

---

## 2. AS DUAS LINHAS CRIATIVAS, LADO A LADO

| | **LINHA 1, PILOTAR** | **LINHA 2, SALÃO** |
|---|---|---|
| **Promete** | Sair da tela e dirigir de verdade na pista principal de Interlagos | Ver ao vivo, lado a lado, as 27 marcas que hoje ela compara por foto |
| **Ingresso** | Drive Pass, R$ 692, exato | Street Pass, a partir de R$ 152 |
| **Link vai pra** | Página do Drive Pass | Página geral de ingressos |
| **Fala com** | Quem navega em esportivo e premium, público menor | Quase todo mundo que está no site, porque todo mundo ali está decidindo compra |
| **Já existe no Meta?** | Sim, e funciona | Não. Ângulo novo |
| **Imagem** | Cockpit, roda na zebra, fila no pit lane | Carro rasante no asfalto, fileira em perspectiva, mão abrindo a porta |
| **Palavra em verde limão** | PILOTE ou 3 CARROS | 27 MARCAS ou AO VIVO |

**Quando usar cada uma**

- **Linha 2 é a linha principal em volume.** Ela conversa com a tarefa que a pessoa está fazendo naquele segundo, que é escolher carro. Vai nos formatos de alcance: Banner Premium, Arroba, Unmissable, e-mail, push.
- **Linha 1 entra onde tem movimento e onde tem perfil.** Native Video, retargeting de quem já clicou, e display em contexto de esportivo e premium.
- **Nunca misturar as duas na mesma peça.** São duas campanhas, dois ingressos, dois links. Peça que fala das duas não vende nenhuma.

**Sobre as duas frases que o cliente trouxe**

- "Já pensou em acelerar um supercarro na pista mais icônica do Brasil?" é fantasia. Cai na gaveta mental de lazer e concorre com show e viagem. Funciona no feed.
- "Já pensou em testar o seu próximo carro na pista mais icônica do Brasil?" é mais forte aqui, porque cai na gaveta de pesquisa de compra, que é justamente a gaveta que já está aberta. O possessivo faz o trabalho: "seu próximo carro" coloca o festival dentro da jornada dela, "um supercarro" pede que ela se imagine sendo outra pessoa.
- **Ressalva:** essa frase só é honesta aplicada ao **salão**, onde ela de fato vê modelos à venda. Aplicada ao Drive Pass vira promessa falsa enquanto a frota não estiver confirmada.

**E o supercarro, sumiu?** Não. Ele muda de função. Vira **gancho visual**, não promessa. Foto de carro potente na pista faz o olho parar, e o texto ao lado continua falando de pista e de marcas. Ele volta a ser promessa no Native Video, que tem movimento e som, e no retargeting.

**Sport Pass está esgotado. Não aparece em peça nenhuma.** Super Sport Pass é sob consulta, então a peça leva para consulta, nunca para preço, e ele não entra em formato de alcance.

### 3.4 UNMISSABLE ADS
Barra fixa acima do header, acompanha o scroll, 100% in-view.

| Spec | Valor |
|---|---|
| Texto | até **85 caracteres**, nas duas versões |
| Versão 1, logo + texto | texto só em **branco ou preto**, por spec deles. Verde limão não entra aqui |
| Logo, versão 1 | PNG transparente, até 150 kb. Desktop máx 32x178 px. Mobile máx 32x88 px |
| Versão 2, imagem/vídeo + texto | PNG, JPG, GIF, MP4 ou MOV. Desktop 1366x40 px. Mobile 266x40 px. Até 150 kb |
| Botão de fechar | branco ou preto, precisa contrastar com o fundo |
| Cor de fundo | hexadecimal. Usar preto |

**Ponto de produção que muda a arte:** em 88 px de largura o logo horizontal do festival não lê. Precisa de uma versão reduzida só com o símbolo. Conferir no tamanho real antes de fechar.

**Ponto de produção da versão 2:** 1366x40 px é praticamente uma tira. Não cabe carro inteiro. Entra só a roda na zebra, ou a zebra em movimento.

### 3.5 NATIVE VIDEO
Aparece no resultado de busca do desktop.

| Spec | Valor |
|---|---|
| Arquivo | MP4, MOV ou GIF |
| Codec | H.264, áudio AAC |
| Duração | 5 a 15 segundos |
| Proporções | 16:9 = 1920x1080 px. 9:16 = 1080x1920 px. 4:5 = 864x1080 px. 1:1 = 1080x1080 px |
| Entrega mínima | 16:9 e 1:1 |
| Texto principal | até **125 caracteres** |
| Título | até **40 caracteres** |

**Regras de montagem:**
- Movimento nos primeiros 0,5 segundo. Carro já andando no primeiro frame. Um corte só.
- **O primeiro segundo precisa ser carro, não logo.**
- Nada de texto que voa e monta letra por letra. Atrasa a leitura.
- **Legenda queimada obrigatória.** Boa parte roda com som desligado.
- Textos na faixa central em todos os cortes, pra não perder nada no 4:5 e no 9:16.

- **A mecânica serve inteira.** É o clique mais barato e mais rápido da lista de formatos comprados, e chega em quem está pesquisando carro.
- **Dois campos foram desenhados pra montadora e não nasceram pra evento:** "título da imagem, marca + modelo, até 15 caracteres" e "selo IBAMA". O resto aceita festival sem forçar.

**Sobre o selo IBAMA:** o selo é exigido em publicidade de **veículo novo**. A nossa peça não oferece veículo à venda, oferece ingresso de evento. Não há veículo anunciado, logo não há selo a aplicar. Não temos selo nenhum pra colocar e não dá pra montar um. **Encaminhamento: pedir por escrito ao comercial da Webmotors a confirmação de que o campo fica vazio no template.** Se a resposta for "o template exige", a peça inteira muda, e o SLA de 3 dias úteis não perdoa.

## 4. O QUE VALE PRAS DUAS LINHAS

### 4.1 Padrão visual
- **Base preta sólida.** A Webmotors é uma página clara, cheia de card branco e azul. O bloco preto é o que separa a peça do resto da tela. Não abrir mão dele.
- **Nunca** fundo branco com borda, nunca degradê suave, nunca card claro dentro de página clara. O contraste vem do fundo, não do enfeite.
- **Uma única palavra em verde limão #A6EC4D** por peça. Se duas palavras estão em verde, nenhuma está em destaque.
- Título em **caixa alta condensada**. Foto real do autódromo. CTA em barra cheia embaixo.
- **A marca do festival entra pequena, num canto.** Ela não é o gancho. O carro é.

### 4.2 Foto
- **Carro reconhecível e grande**, ocupando pelo menos 60% da área útil, de frente ou em 3/4, com Interlagos identificável no fundo: asfalto, zebra, box, curva.
- **Três fotos que funcionam na linha 1:** cockpit em primeira pessoa com o arco do volante embaixo e a zebra fugindo no para-brisa; close da roda pisando na zebra com blur no fundo; fila de carros no pit lane, só em formato largo.
- **Três fotos que funcionam na linha 2:** carro rasante no asfalto com câmera na altura do farol e arquibancada desfocada atrás; fileira de carros em perspectiva comprimida; mão abrindo a porta ou pessoa sentando no banco, com o rosto fora de quadro.
- **Corte fechado sempre.** Se sobrar teto de galpão, carpete de estande ou grade no quadro, refaz o corte.
- **Confira se a foto é da edição auto.** Se aparecer moto em qualquer canto, a peça não pode ir.
- Se a única foto disponível for de estande, salva com o padrão da marca: crop fechado no carro e faixa preta cobrindo teto e piso, com o título por cima.

### 4.3 Texto
- **Uma frase só.** Título de 5 a 7 palavras, uma linha de apoio, um botão. Três níveis de hierarquia viram cartaz e a peça perde.
- **Todo número com unidade.** R$ 692, 27 marcas, 27 a 30 de agosto, 60 kb.
- **Sempre a data absoluta: "27 a 30 de agosto".** Nunca "essa semana", "esse fim de semana" ou "faltam 3 dias". A peça fica no ar vários dias e contagem regressiva em arte estática envelhece sozinha.

### 4.4 CTA
- **Verbo específico, em barra cheia, texto curto e concreto:** "Ver ingressos de pista", "Ver marcas confirmadas", "Quero pilotar".
- **Nunca "Saiba mais".** Não diz nada.
- **Nunca "Garanta já".** É linguagem de evento, e evento é a gaveta errada aqui. A exceção única é o Banner Premium desktop da linha 2, onde "GARANTA SEU STREET PASS, A PARTIR DE R$ 152" já vem com o produto e o preço colados, o que segura o sentido.

### 4.5 Preço
- **Street Pass: sempre "a partir de R$ 152"**, e nunca como título da peça. A promessa vem primeiro, o preço entra na barra de CTA ou na linha de apoio. R$ 152 sem contexto lê como ingresso de show.
- **Exceção:** nos formatos minúsculos (Mini Banner 320x100, Super Banner 90 px, Unmissable) o preço pode subir pra linha principal, porque ali ele é o argumento que cabe.
- **Drive Pass: R$ 692, exato.** Nunca "a partir de".
- Nunca "só", "apenas" ou "por incríveis". Derruba o padrão premium.

### 4.6 Marca de montadora
- **Cita em texto, nunca usa logo.** Logo precisa de liberação por escrito que a gente não tem, a Webmotors vende mídia pras próprias montadoras, e logo de marca no banner confunde quem é o anunciante.
- **O padrão é o número: "27 marcas".** Carrega a ideia de amplitude sem citar ninguém e sem risco.
- Se precisar de mais concretude, usar categoria: "as marcas chinesas que chegaram esse ano", "de popular a superesportivo".
- Nomes só em texto, só se liberado, em tipografia da peça, com a linha "marcas confirmadas, sujeito a alteração" em corpo pequeno. **Logo, só na landing page.**

### 4.7 Link e medição
- **Todo link parametrizado com UTM por formato.** O CRM push exige por spec, mas vale pra todas.
- Linha 1 vai pra **página do Drive Pass**. Linha 2 vai pra **página geral de ingressos**.
- Se as peças todas apontarem pra home, não dá pra saber qual formato vendeu, e a campanha inteira vira palpite.

## 5. O QUE NÃO ENTRA NESSA CAMPANHA

**Ingresso e preço**
- **Sport Pass, em lugar nenhum.** Está esgotado.
- **Preço do Super Sport Pass, em lugar nenhum.** É sob consulta. Ele também não entra em formato de alcance: são 3 grupos só, e queimar impressão de Home Premium com isso é desperdício. Ele cabe em Native Video de retargeting e no e-mail, com CTA de consultar disponibilidade.
- **Street Pass não aparece em peça de linha 1.** Puxa a pessoa pro ingresso errado. A gente pagou mídia cara pra vender um ticket de R$ 692, não pra converter no ticket de entrada.
- **Nada de "compre seu ingresso" genérico.** Joga todo mundo na home.

**Promessa**
- **Não escrever "teste o seu próximo carro" em peça de pista** enquanto a frota do Drive Pass não estiver confirmada. Se a pessoa comprar esperando testar o carro que está pesquisando e pilotar três esportivos que não estão no showroom, isso é reclamação.
- **Não escrever "test drive" sozinho.** Na Webmotors, test drive é o que a concessionária oferece de graça. Sem "na pista de Interlagos", a promessa perde valor.
- **Peça de linha 2 não pode dizer nem sugerir "dirija", "acelere" ou "test drive na pista".** O Street Pass dá acesso ao Boulevard, aos shows de drift, à roda gigante e à tirolesa. Ele **não** dá test drive na pista. Sugerir isso é promessa falsa e ainda canibaliza o Drive Pass.
- Não citar modelo específico em peça nenhuma.

**Imagem**
- Nada de palco, show, multidão, roda gigante ou tirolesa. Outro produto, outro público.
- Nada de rosto de pessoa nos tamanhos pequenos.
- Nada de carro inteiro em plano aberto no 300x250 e no 320x100. Some.
- Nada de carro em plataforma giratória com fundo branco. Lê como banco de imagem.
- Nada de foto com moto. É a edição auto.
- Nenhum logo de montadora em peça nenhuma.

**Produção**
- **Banner Premium é JPG ou PNG estático.** Não mandar GIF nem HTML5 pra ele.
- Não deixar texto na sangria: desktop 48 px em cima e embaixo e 320 px nas laterais, mobile 41 px em cima e 61 px embaixo.
- **Não usar verde limão como cor de texto no Unmissable versão 1.** Só branco ou preto, por spec deles. Com fundo preto, o botão de fechar vai branco.
- **Não cortar criativo do Meta.** Reconstruir cada tamanho.
- **Loja Oficial fica fora**, pelos motivos do item 3.13.

**Mistura**
- Linha 1 e linha 2 nunca na mesma peça.

  function linhaTabela(l){
    var c = l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|");
    return c.map(function(x){ return x.trim(); });
  }

  var out = [], linhas = md.split("\n"), i = 0;
  while(i < linhas.length){
    var l = linhas[i];

    if(/^\s*$/.test(l)){ i++; continue; }

    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    var h = /^(#{1,6})\s+(.*)$/.exec(l);
    if(h){ var n = h[1].length; out.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); i++; continue; }

    // tabela: cabecalho, separador com tracos, depois as linhas
    if(/^\s*\|/.test(l) && i+1 < linhas.length && /^\s*\|[\s:|-]+\|\s*$/.test(linhas[i+1])){
      var cab = linhaTabela(l), corpo = [];
      i += 2;
      while(i < linhas.length && /^\s*\|/.test(linhas[i])){ corpo.push(linhaTabela(linhas[i])); i++; }
      var t = '<div class="tw"><table><thead><tr>';
      cab.forEach(function(c){ t += "<th>"+inline(c)+"</th>"; });
      t += "</tr></thead><tbody>";
      corpo.forEach(function(r){
        t += "<tr>";
        r.forEach(function(c){ t += "<td>"+inline(c)+"</td>"; });
        t += "</tr>";
      });
      out.push(t + "</tbody></table></div>");
      continue;
    }

    if(/^\s*[-*]\s+/.test(l)){
      var ul = "<ul>";
      while(i < linhas.length && /^\s*[-*]\s+/.test(linhas[i])){
        ul += "<li>" + inline(linhas[i].replace(/^\s*[-*]\s+/,"")) + "</li>"; i++;
      }
      out.push(ul + "</ul>"); continue;
    }

    if(/^\s*\d+\.\s+/.test(l)){
      var ol = "<ol>";
      while(i < linhas.length && /^\s*\d+\.\s+/.test(linhas[i])){
        ol += "<li>" + inline(linhas[i].replace(/^\s*\d+\.\s+/,"")) + "</li>"; i++;
      }
      out.push(ol + "</ol>"); continue;
    }

    // paragrafo: junta ate a linha em branco ou ate comecar outra estrutura
    var p = [];
    while(i < linhas.length && !/^\s*$/.test(linhas[i]) && !/^#{1,6}\s/.test(linhas[i]) &&
          !/^\s*\|/.test(linhas[i]) && !/^\s*[-*]\s+/.test(linhas[i]) &&
          !/^\s*\d+\.\s+/.test(linhas[i]) && !/^---+\s*$/.test(linhas[i])){
      p.push(linhas[i]); i++;
    }
    if(p.length) out.push("<p>" + inline(p.join(" ")) + "</p>");
  }

  var html = out.join("\n");
  document.getElementById("doc").innerHTML = html;

  // o bloco de travas vira caixa vermelha: e a unica parte que precisa de
  // resposta do cliente antes da designer comecar
  var alvo = null;
  Array.prototype.forEach.call(document.querySelectorAll("#doc h2"), function(x){
    if(/LEIA ISTO ANTES/i.test(x.textContent)) alvo = x;
  });
  if(alvo){
    var caixa = document.createElement("div");
    caixa.className = "aviso";
    var pai = alvo.parentNode;
    pai.insertBefore(caixa, alvo);
    var no = alvo;
    while(no && !(no.tagName === "H2" && no !== alvo) && !(no.tagName === "HR" && no !== alvo)){
      var prox = no.nextSibling;
      caixa.appendChild(no);
      no = prox;
    }
  }
})();
</script>
