<script id="md" type="text/plain"># WEBMOTORS · O QUE PRODUZIR
### Suhai Festival Interlagos, edição AUTO. 27 a 30 de agosto, Autódromo de Interlagos.

Campanha dentro do site da Webmotors. Quem vê está pesquisando carro pra comprar,
com filtro ligado, comparando versão e preço. Peça que parece cartaz de festival
é ignorada. Peça que fala de carro entra.

---

## AS 3 LINHAS

| | O que promete | Ingresso | Preço na peça |
|---|---|---|---|
| **SALÃO** | Ver ao vivo as 27 marcas que ela compara por foto | Street Pass | a partir de R$ 180 |
| **PILOTAR** | Dirigir de verdade na pista principal | Drive Pass | R$ 692 |
| **SUPERCARRO** | Acelerar um supercarro em Interlagos | Super Sport Pass | **sem preço** |

Uma linha por peça. Peça que fala das três não vende nenhuma.

---

**Margens de segurança do Banner Premium**, e só ele tem:

## QUANTAS ARTES MANDAR

O portfólio da Webmotors **não diz quantos criativos cabem por formato**. Isso vem
do pedido de inserção, não da especificação técnica. Confirmar com o comercial deles.

O que dá pra dizer com segurança:

- **Display aceita rodízio.** Arroba, Mini Banner, Billboard, Super Banner,
  Skyscraper e Card giram mais de uma peça na mesma compra
- **A recomendação é 2 por formato**, uma de salão e uma de pilotar, pra comparar
  qual puxa mais clique. A de supercarro entra como terceira só nos formatos
  grandes, que é onde ela tem espaço pra impressionar
- **Banner Premium precisa das duas versões**, desktop e mobile, sempre. Não é
  escolha, são dois arquivos diferentes
- **Unmissable também são dois arquivos**, 1366 × 40 e 266 × 40

---

## REGRAS QUE VALEM PRA TODAS

- Fundo preto, uma palavra em verde limão **#A6EC4D**, título em caixa alta
  condensada. É o padrão que já roda no Meta
- **Foto de carro sempre**, nunca palco, multidão ou público. Carro na pista, no
  pit lane ou no salão
- Nos tamanhos pequenos o carro inteiro some. Usar **recorte**: roda na zebra,
  frente do carro, cockpit
- Logo do festival pequeno, num canto. Ele não é o que vende aqui
- **Data em todas as peças**, sempre `27 a 30 de agosto`
- Não cortar peça do Meta pra encaixar. Story em 728 × 90 não vira nada

---

## O QUE NÃO ENTRA

- **Sport Pass está esgotado.** Não aparece em peça nenhuma
- **Loja Oficial não serve.** É página de marca com seletor de versão e cores do
  veículo, feita pra montadora vender carro. Não tem uso pra festival
- **Preço na linha de supercarro**, pelo motivo acima
- Nome de montadora dentro da peça, sem autorização escrita de cada uma

---

## PENDÊNCIAS

- **O Drive Pass está como R$ 692.** Se o lote virou pra todos os ingressos e não
  só pro Street Pass, me avisa que eu troco em todas as copys
- **Não sabemos quais carros o Drive Pass entrega.** Sem essa lista, nenhuma peça
  pode citar modelo. As copys acima já estão na versão que não depende disso
- **E-mail patrocinado e CRM Push, se foram comprados, são os primeiros da fila.**
  Quem diagrama é a Webmotors, com prazo de até 3 dias úteis, e o relógio deles só
  começa com o material completo na mão. Hoje é 20 e o evento é 27

<script>
/* Conversor de markdown enxuto, escrito aqui de proposito em vez de puxar
   biblioteca de CDN: esta pagina vai ser aberta pela designer, as vezes no
   celular e as vezes em rede de agencia que bloqueia CDN. Se o script externo
   nao carregasse, ela abriria uma pagina em branco e nao saberia por que.
   Cobre exatamente o que este documento usa: titulo, tabela, lista, lista
   numerada, negrito, trecho de codigo, linha divisoria e paragrafo. */
(function(){
  var md = document.getElementById("md").textContent;

  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  // negrito e codigo. O codigo entra DEPOIS do escape pra nao escapar as tags
  // que ele mesmo gera, e vem antes do negrito porque chamada com ** dentro de
  // crase tem que sair literal.
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(_, t){ return "<code>" + t + "</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  function linhaTabela(l){
    var c = l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|");
    return c.map(function(x){ return x.trim(); });
  }

  var out = [], linhas = md.split("\n"), i = 0;
  while(i < linhas.length){
    var l = linhas[i];

    if(/^\s*$/.test(l)){ i++; continue; }

    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    var h = /^(#{1,6})\s+(.*)$/.exec(l);
    if(h){ var n = h[1].length; out.push("<h"+n+">"+inline(h[2])+"</h"+n+">"); i++; continue; }

    // tabela: cabecalho, separador com tracos, depois as linhas
    if(/^\s*\|/.test(l) && i+1 < linhas.length && /^\s*\|[\s:|-]+\|\s*$/.test(linhas[i+1])){
      var cab = linhaTabela(l), corpo = [];
      i += 2;
      while(i < linhas.length && /^\s*\|/.test(linhas[i])){ corpo.push(linhaTabela(linhas[i])); i++; }
      var t = '<div class="tw"><table><thead><tr>';
      cab.forEach(function(c){ t += "<th>"+inline(c)+"</th>"; });
      t += "</tr></thead><tbody>";
      corpo.forEach(function(r){
        t += "<tr>";
        r.forEach(function(c){ t += "<td>"+inline(c)+"</td>"; });
        t += "</tr>";
      });
      out.push(t + "</tbody></table></div>");
      continue;
    }

    if(/^\s*[-*]\s+/.test(l)){
      var ul = "<ul>";
      while(i < linhas.length && /^\s*[-*]\s+/.test(linhas[i])){
        ul += "<li>" + inline(linhas[i].replace(/^\s*[-*]\s+/,"")) + "</li>"; i++;
      }
      out.push(ul + "</ul>"); continue;
    }

    if(/^\s*\d+\.\s+/.test(l)){
      var ol = "<ol>";
      while(i < linhas.length && /^\s*\d+\.\s+/.test(linhas[i])){
        ol += "<li>" + inline(linhas[i].replace(/^\s*\d+\.\s+/,"")) + "</li>"; i++;
      }
      out.push(ol + "</ol>"); continue;
    }

    // paragrafo: junta ate a linha em branco ou ate comecar outra estrutura
    var p = [];
    while(i < linhas.length && !/^\s*$/.test(linhas[i]) && !/^#{1,6}\s/.test(linhas[i]) &&
          !/^\s*\|/.test(linhas[i]) && !/^\s*[-*]\s+/.test(linhas[i]) &&
          !/^\s*\d+\.\s+/.test(linhas[i]) && !/^---+\s*$/.test(linhas[i])){
      p.push(linhas[i]); i++;
    }
    if(p.length) out.push("<p>" + inline(p.join(" ")) + "</p>");
  }

  var html = out.join("\n");
  document.getElementById("doc").innerHTML = html;

  // o bloco de travas vira caixa vermelha: e a unica parte que precisa de
  // resposta do cliente antes da designer comecar
  var alvo = null;
  Array.prototype.forEach.call(document.querySelectorAll("#doc h2"), function(x){
    if(/PEND/i.test(x.textContent)) alvo = x;
  });
  if(alvo){
    var caixa = document.createElement("div");
    caixa.className = "aviso";
    var pai = alvo.parentNode;
    pai.insertBefore(caixa, alvo);
    var no = alvo;
    while(no && !(no.tagName === "H2" && no !== alvo) && !(no.tagName === "HR" && no !== alvo)){
      var prox = no.nextSibling;
      caixa.appendChild(no);
      no = prox;
    }
  }
})();
</script>
